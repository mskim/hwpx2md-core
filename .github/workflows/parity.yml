name: parity

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test-parity:
    runs-on: ubuntu-latest
    steps:
      # `submodules: true` checks out the submodule SHA pinned in the
      # superproject (deterministic, what we want). It does NOT track the
      # submodule's tracked branch (`feat/phase-1-ruby-implementation`, per
      # .gitmodules); use
      # `submodule update --remote` locally to pick up upstream changes.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # actions/checkout does NOT apply sparse-checkout config from
      # `.gitmodules`; invoke it explicitly so the workflow doesn't
      # see the full Ruby source tree.
      - name: Apply sparse-checkout to spec submodule
        run: |
          git -C vendor/hwpx2md-spec sparse-checkout init --cone
          git -C vendor/hwpx2md-spec sparse-checkout set spec test/data test/golden

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test:parity

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # 9 tests inherited from the hwpx2md extension fail: stale Phase 1-4
      # expectations asserting `images/` paths and padded table separators, both
      # of which the parser stopped emitting. They are NOT parser drift — the
      # shared-spec golden corpus passes byte-exactly on all 15 fixtures in
      # `parity`. Asserting the exact count is what makes a 10th failure visible;
      # `continue-on-error` would hide it.
      #
      # Lower this number when the stale expectations are reconciled. Never raise it.
      - name: Unit suite, with 9 known-stale failures
        run: |
          npx vitest run --exclude 'test/parity/**' --reporter=json --outputFile=/tmp/u.json || true
          failed=$(node -e "console.log(require('/tmp/u.json').numFailedTests)")
          echo "failed=$failed (expected 9)"
          [ "$failed" -eq 9 ] || { echo "::error::expected exactly 9 known failures, got $failed" >&2; exit 1; }
